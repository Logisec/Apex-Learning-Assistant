<div id="apexHelperPanel" class="apex-helper-panel">
    <div class="apex-helper-header">
        <div class="apex-helper-title">
            <i class="bi bi-brain"></i> Apex Helper
        </div>
        <button id="apexHelperClose" class="apex-helper-close-button" title="Minimize panel">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div class="apex-helper-status-container">
        <div id="apexHelperStatus" class="apex-helper-status">Ready</div>
    </div>

    <div id="apexHelperQuestionCounter" class="apex-helper-question-counter">
        Question
    </div>

    <div class="apex-helper-buttons">
        <div class="apex-helper-button-row">
            <button id="apexHelperFind" class="apex-helper-button apex-helper-find-button">
                <i class="bi bi-search"></i> Find Answer
            </button>
            <button id="apexHelperFindSubmit" class="apex-helper-button apex-helper-find-submit-button">
                <i class="bi bi-check-circle"></i> Find & Submit
            </button>
        </div>

        <div class="apex-helper-button-row">
            <button id="apexHelperSubmit" class="apex-helper-button apex-helper-submit-button">
                <i class="bi bi-upload"></i> Submit
            </button>
            <button id="apexHelperNext" class="apex-helper-button apex-helper-next-button">
                <i class="bi bi-skip-forward"></i> Next
            </button>
        </div>

        <button id="apexHelperSolveAll" class="apex-helper-button apex-helper-solve-all-button">
            <i class="bi bi-lightning"></i> Auto-Solve All Questions
        </button>
    </div>

    <div class="apex-helper-keyboard-shortcuts">
        <details>
            <summary>Keyboard Shortcuts</summary>
            <ul class="apex-helper-shortcuts-list">
                <li>
                    <span class="apex-helper-shortcut">Alt+A</span> Find Answer
                </li>
                <li>
                    <span class="apex-helper-shortcut">Alt+S</span> Submit
                    Answer
                </li>
                <li>
                    <span class="apex-helper-shortcut">Alt+N</span> Next
                    Question
                </li>
                <li>
                    <span class="apex-helper-shortcut">Alt+Q</span> Auto-Solve
                    All
                </li>
            </ul>
        </details>
    </div>

    <div class="apex-helper-footer">
        <span class="apex-helper-version">v1.0.1</span>
    </div>
</div>
